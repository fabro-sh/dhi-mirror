name: Mirror DHI to GHCR

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - source: dhi.io/alpine-base:3.23-dev
            repo: ghcr.io/fabro-sh/dhi-alpine-base
            tag: 3.23-dev
          - source: dhi.io/alpine-base:3.23
            repo: ghcr.io/fabro-sh/dhi-alpine-base
            tag: "3.23"
    env:
      DHI_USERNAME: ${{ vars.DHI_USERNAME }}
      DHI_TOKEN: ${{ secrets.DHI_TOKEN }}
      GHCR_USERNAME: ${{ github.actor }}
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out certificate verification fixtures
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Login to dhi.io
        run: echo "$DHI_TOKEN" | docker login dhi.io -u "$DHI_USERNAME" --password-stdin

      - name: Login to GHCR
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin

      - name: Compute date tag
        id: date
        run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Resolve and verify exact source before mirroring
        id: source
        env:
          SOURCE_IMAGE: ${{ matrix.image.source }}
        run: |
          digest=$(docker buildx imagetools inspect "$SOURCE_IMAGE" --format '{{.Manifest.Digest}}')
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          image="$SOURCE_IMAGE@$digest"
          scripts/verify-image-trust.sh "$image"
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - name: Mirror ${{ matrix.image.source }}
        env:
          VERIFIED_SOURCE: ${{ steps.source.outputs.image }}
        run: |
          docker buildx imagetools create \
            --tag ${{ matrix.image.repo }}:${{ matrix.image.tag }} \
            --tag ${{ matrix.image.repo }}:${{ matrix.image.tag }}-${{ steps.date.outputs.date }} \
            "$VERIFIED_SOURCE"

      - name: Show mirrored digest
        run: docker buildx imagetools inspect ${{ matrix.image.repo }}:${{ matrix.image.tag }}
